name: guardian
description: "Guardian - Women's Safety App — AI-powered, offline-capable"
publish_to: 'none'
version: 2.0.0+1

environment:
  sdk: '>=3.4.4 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.6

  # ═══════════════════════════════════════════════
  # Firebase
  # ═══════════════════════════════════════════════
  firebase_core: ^3.8.1
  firebase_messaging: ^15.1.6

  # ═══════════════════════════════════════════════
  # State Management — Riverpod ONLY (GetIt removed)
  # ═══════════════════════════════════════════════
  flutter_riverpod: ^2.6.1

  # ═══════════════════════════════════════════════
  # Offline-First Database (Drift + SQLite)
  # ═══════════════════════════════════════════════
  drift: ^2.35.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.4
  path: ^1.9.0

  # ═══════════════════════════════════════════════
  # Maps and Location — OpenStreetMap (FREE, no API key)
  # ═══════════════════════════════════════════════
  flutter_map: ^7.0.2           # OSM map rendering (replaces google_maps_flutter)
  latlong2: ^0.9.0              # LatLng type for flutter_map
  flutter_map_tile_caching: ^9.1.0  # Offline tile caching for no-network mode
  geolocator: ^13.0.2
  geocoding: ^3.0.0
  sensors_plus: ^4.0.2

  # ═══════════════════════════════════════════════
  # Audio — voice SOS + emergency recording
  # ═══════════════════════════════════════════════
  speech_to_text: ^7.0.0
  record: ^6.1.2                     # Emergency audio recording

  # ═══════════════════════════════════════════════
  # UI Components
  # ═══════════════════════════════════════════════
  flutter_svg: ^2.0.9
  cached_network_image: ^3.3.1
  lottie: ^3.1.3
  shimmer: ^3.0.0
  google_fonts: ^6.2.2

  # ═══════════════════════════════════════════════
  # Core Utilities
  # ═══════════════════════════════════════════════
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.2.3     # Emergency contacts stored encrypted
  permission_handler: ^11.2.0
  # 9.4.7 conflicts with geolocator_apple in Flutter 3.47 iOS builds.
  permission_handler_apple: ^9.6.1
  url_launcher: ^6.2.4               # Emergency call + iOS SMS fallback
  intl: ^0.20.2
  connectivity_plus: ^6.1.4
  dio: ^5.7.0
  http: ^1.2.0
  uuid: ^4.5.1
  geohash_plus: ^1.1.0
  crypto: ^3.0.5                     # Compact SMS integrity checks

  # ═══════════════════════════════════════════════
  # Notifications
  # ═══════════════════════════════════════════════
  flutter_local_notifications: ^19.2.1

  # ═══════════════════════════════════════════════
  # Routing
  # ═══════════════════════════════════════════════
  go_router: ^14.6.2

  # ═══════════════════════════════════════════════
  # Code Generation Support
  # ═══════════════════════════════════════════════
  equatable: ^2.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  flutter_lints: ^4.0.0

  # Code Generation
  build_runner: ^2.16.1
  drift_dev: ^2.35.0

  # Testing
  mockito: ^5.4.4
  mocktail: ^1.0.3
  network_image_mock: ^2.1.1

dependency_overrides:
  google_fonts: ^6.2.2

flutter:
  uses-material-design: true

  # Several native plugins still require CocoaPods. Keeping one iOS dependency
  # manager avoids duplicate Objective-C symbols in mixed SwiftPM/Pods builds.
  config:
    enable-swift-package-manager: false

  assets:
    - assets/images/
    - assets/images/onboarding/
    - assets/icons/
    - assets/animations/
    - assets/translations/
    # TFLite models (added when trained)
    # - assets/models/
