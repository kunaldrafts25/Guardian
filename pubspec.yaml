name: guardian
description: "Guardian - Women's Safety App with Community Protection"
publish_to: 'none'
version: 2.0.0+1

environment:
  sdk: '>=3.4.4 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.6

  # Firebase Core
  firebase_core: ^3.8.1
  firebase_auth: ^5.3.4
  cloud_firestore: ^5.5.1
  firebase_storage: ^12.3.7
  firebase_messaging: ^15.1.6
  firebase_analytics: ^11.3.6
  google_sign_in: ^6.2.1

  # State Management (Riverpod + BLoC)
  flutter_riverpod: ^2.6.1
  flutter_bloc: ^9.1.1
  
  # Dependency Injection
  get_it: ^8.0.3
  injectable: ^2.5.0

  # Maps and Location
  google_maps_flutter: ^2.5.3
  geolocator: ^13.0.2
  geocoding: ^3.0.0
  sensors_plus: ^4.0.2

  # UI Components
  flutter_svg: ^2.0.9
  cached_network_image: ^3.3.1
  lottie: ^3.1.3
  shimmer: ^3.0.0
  google_fonts: ^6.1.0

  # Bluetooth - removed (flutter_blue_plus) - not currently used

  # Utilities
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.2.3
  permission_handler: ^11.2.0
  url_launcher: ^6.2.4
  intl: ^0.20.2
  connectivity_plus: ^6.1.4
  dio: ^5.7.0
  http: ^1.2.0
  uuid: ^4.5.1

  # Geohash for location privacy
  geohash_plus: ^1.1.0

  # Environment variables
  flutter_dotenv: ^5.1.0

  # SMS and Calls - using url_launcher for calls instead
  # telephony package discontinued - not compatible with AGP 8.3.0

  # Audio/Video Recording - removed (camera, record) - not currently used
  
  # Notifications
  flutter_local_notifications: ^19.2.1

  # Routing
  go_router: ^14.6.2

  # Equality
  equatable: ^2.0.7
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  flutter_lints: ^4.0.0

  # Code Generation
  build_runner: ^2.4.13
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  injectable_generator: ^2.6.2

  # Testing
  mockito: ^5.4.4
  mocktail: ^1.0.3
  bloc_test: ^10.0.0
  network_image_mock: ^2.1.1
  fake_cloud_firestore: ^3.1.0
  firebase_auth_mocks: ^0.14.1

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/images/
    - assets/images/onboarding/
    - assets/icons/
    - assets/animations/
    - assets/translations/
