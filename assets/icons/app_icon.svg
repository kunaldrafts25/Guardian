<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Soft shadow and radial gradient for launcher depth -->
    <radialGradient id="guardianCanvas" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F2EFE9"/>
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#1C2520" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Squircle Canvas (Porcelain) -->
  <rect width="512" height="512" rx="112" fill="url(#guardianCanvas)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#D7DDD8" stroke-width="4"/>

  <!-- Symbol Container with subtle elevation -->
  <g filter="url(#shadow)">
    <!-- Primary Enclosing Protective Arch forming abstract 'G' in Forest Green -->
    <path d="M 256,76 
             C 152,76 76,152 76,256 
             C 76,360 152,436 256,436 
             C 336,436 404,386 428,312 
             L 364,292 
             C 346,340 298,372 256,372 
             C 192,372 140,320 140,256 
             C 140,192 192,140 256,140 
             C 304,140 344,168 362,208 
             L 426,184 
             C 394,118 330,76 256,76 Z" 
          fill="#244D3C" />

    <!-- Horizontal arm of G extending inwards safely -->
    <path d="M 264,232 
             L 416,232 
             C 426,232 434,240 434,250 
             L 434,262 
             C 434,272 426,280 416,280 
             L 264,280 
             Z" 
          fill="#244D3C" />

    <!-- Protected Human / Beacon Presence in controlled Coral-Red (#C6424E) -->
    <circle cx="256" cy="256" r="38" fill="#C6424E" />
    <circle cx="256" cy="256" r="14" fill="#F7F5EF" />
  </g>
</svg>
