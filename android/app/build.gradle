plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader("UTF-8") { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty("flutter.versionCode")
if (flutterVersionCode == null) {
    flutterVersionCode = "1"
}

def flutterVersionName = localProperties.getProperty("flutter.versionName")
if (flutterVersionName == null) {
    flutterVersionName = "1.0"
}

def releaseStoreFile = System.getenv("GUARDIAN_KEYSTORE_PATH") ?: localProperties.getProperty("guardian.storeFile")
def releaseStorePassword = System.getenv("GUARDIAN_KEYSTORE_PASSWORD") ?: localProperties.getProperty("guardian.storePassword")
def releaseKeyAlias = System.getenv("GUARDIAN_KEY_ALIAS") ?: localProperties.getProperty("guardian.keyAlias")
def releaseKeyPassword = System.getenv("GUARDIAN_KEY_PASSWORD") ?: localProperties.getProperty("guardian.keyPassword")
def releaseSigningConfigured = [
    releaseStoreFile,
    releaseStorePassword,
    releaseKeyAlias,
    releaseKeyPassword,
].every { value -> value != null && !value.trim().isEmpty() }
def releaseTaskRequested = gradle.startParameter.taskNames.any {
    taskName -> taskName.toLowerCase().contains("release")
}

if (releaseTaskRequested && !releaseSigningConfigured) {
    throw new GradleException(
        "Release signing is required. Set GUARDIAN_KEYSTORE_PATH, " +
        "GUARDIAN_KEYSTORE_PASSWORD, GUARDIAN_KEY_ALIAS, and GUARDIAN_KEY_PASSWORD."
    )
}

android {
    namespace = "com.company.guardian"
    compileSdk = 36
    ndkVersion = flutter.ndkVersion

    compileOptions {
        // Enable core library desugaring for flutter_local_notifications
        coreLibraryDesugaringEnabled true
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
        freeCompilerArgs += ["-Xskip-metadata-version-check"]
    }

    defaultConfig {
        // Application ID matching Firebase configuration
        applicationId = "com.company.guardian"
        // You can update the following values to match your application needs.
        // For more information, see: https://docs.flutter.dev/deployment/android#reviewing-the-gradle-build-configuration.
        minSdkVersion = flutter.minSdkVersion // Updated from 21 to 23 for record_android plugin compatibility
        targetSdk = 35 // Updated from flutter.targetSdkVersion to fix plugin compatibility issues
        versionCode = flutterVersionCode.toInteger()
        versionName = flutterVersionName
        
        // Enable multidex for large app
        multiDexEnabled true
        
    }

    signingConfigs {
        if (releaseSigningConfigured) {
            release {
                storeFile = file(releaseStoreFile)
                storePassword = releaseStorePassword
                keyAlias = releaseKeyAlias
                keyPassword = releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            signingConfig = releaseSigningConfigured ? signingConfigs.release : null
        }
    }
}

flutter {
    source = "../.."
}

dependencies {
    // Core library desugaring for Java 8+ APIs (required by flutter_local_notifications)
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
    implementation 'androidx.security:security-crypto:1.0.0'
}
