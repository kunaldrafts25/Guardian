plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

// FlutterFire declares the native Firebase SDKs from pubspec.yaml. Apply the
// Google Services plug-in only when a real Firebase config is available so
// CI and source builds never require a checked-in or fabricated config file.
def googleServicesConfigPresent = [
    file("google-services.json"),
    file("src/debug/google-services.json"),
    file("src/release/google-services.json"),
].any { configFile -> configFile.exists() }

if (googleServicesConfigPresent) {
    apply plugin: "com.google.gms.google-services"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader("UTF-8") { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty("flutter.versionCode")
if (flutterVersionCode == null) {
    flutterVersionCode = "1"
}

def flutterVersionName = localProperties.getProperty("flutter.versionName")
if (flutterVersionName == null) {
    flutterVersionName = "1.0"
}

def releaseStoreFile = System.getenv("GUARDIAN_KEYSTORE_PATH") ?: localProperties.getProperty("guardian.storeFile")
def releaseStorePassword = System.getenv("GUARDIAN_KEYSTORE_PASSWORD") ?: localProperties.getProperty("guardian.storePassword")
def releaseKeyAlias = System.getenv("GUARDIAN_KEY_ALIAS") ?: localProperties.getProperty("guardian.keyAlias")
def releaseKeyPassword = System.getenv("GUARDIAN_KEY_PASSWORD") ?: localProperties.getProperty("guardian.keyPassword")
def releaseSigningConfigured = [
    releaseStoreFile,
    releaseStorePassword,
    releaseKeyAlias,
    releaseKeyPassword,
].every { value -> value != null && !value.trim().isEmpty() }

def googleMapsAndroidApiKey =
    System.getenv("GUARDIAN_GOOGLE_MAPS_ANDROID_API_KEY") ?:
    localProperties.getProperty("guardian.googleMapsAndroidApiKey") ?:
    "NOT_CONFIGURED"
def releaseTaskRequested = gradle.startParameter.taskNames.any {
    taskName -> taskName.toLowerCase().contains("release")
}

if (releaseTaskRequested && !releaseSigningConfigured) {
    logger.warn("Release keystore not set; signing staging release with debug key.")
}

android {
    namespace = "com.company.guardian"
    compileSdk = 36
    ndkVersion = flutter.ndkVersion

    compileOptions {
        // Enable core library desugaring for flutter_local_notifications
        coreLibraryDesugaringEnabled true
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
        freeCompilerArgs += ["-Xskip-metadata-version-check"]
    }

    defaultConfig {
        // Application ID matching Firebase configuration
        applicationId = "com.company.guardian"
        // You can update the following values to match your application needs.
        // For more information, see: https://docs.flutter.dev/deployment/android#reviewing-the-gradle-build-configuration.
        minSdkVersion = 24 // Required by current google_maps_flutter Android SDK
        targetSdk = 35 // Updated from flutter.targetSdkVersion to fix plugin compatibility issues
        versionCode = flutterVersionCode.toInteger()
        versionName = flutterVersionName
        manifestPlaceholders = [GOOGLE_MAPS_API_KEY: googleMapsAndroidApiKey]
        
        // Enable multidex for large app
        multiDexEnabled true
        
    }

    signingConfigs {
        if (releaseSigningConfigured) {
            release {
                storeFile = file(releaseStoreFile)
                storePassword = releaseStorePassword
                keyAlias = releaseKeyAlias
                keyPassword = releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            signingConfig = releaseSigningConfigured ? signingConfigs.release : signingConfigs.debug
        }
    }
}

flutter {
    source = "../.."
}

dependencies {
    // Core library desugaring for Java 8+ APIs (required by flutter_local_notifications)
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
    implementation 'androidx.security:security-crypto:1.0.0'
    // P1-04: Android WorkManager for durable cloud outbox
    implementation 'androidx.work:work-runtime-ktx:2.9.0'
}
