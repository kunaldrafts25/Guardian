AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Guardian production API, authentication, and emergency data plane

Globals:
  Function:
    Runtime: python3.12
    Timeout: 30
    MemorySize: 512
  Api:
    Cors:
      AllowMethods: "'GET,POST,PUT,PATCH,DELETE,OPTIONS'"
      AllowHeaders: "'Content-Type,Authorization,X-Correlation-ID,X-Guardian-Session-ID,X-Amz-Date,X-Api-Key,X-Amz-Security-Token'"
      AllowOrigin: "'*'"
    Auth:
      DefaultAuthorizer: CognitoAuthorizer
      AddDefaultAuthorizerToCorsPreflight: false
      Authorizers:
        CognitoAuthorizer:
          UserPoolArn: !GetAtt GuardianUserPool.Arn
          Identity:
            Header: Authorization

Parameters:
  EnvironmentName:
    Type: String
    Default: staging
    AllowedPattern: '^[a-z0-9-]{2,20}$'
    Description: Environment suffix used to isolate staging and production resources
  FcmPlatformApplicationArn:
    Type: String
    Default: ''
    Description: Existing SNS platform application ARN for Android FCM
  ApnsPlatformApplicationArn:
    Type: String
    Default: ''
    Description: Existing SNS platform application ARN for iOS APNs

Resources:
  DefineAuthChallengeFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: cognito_triggers.define_auth_challenge

  CreateAuthChallengeFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: cognito_triggers.create_auth_challenge
      Environment:
        Variables:
          OTP_TTL_SECONDS: '300'
          OTP_MAX_ATTEMPTS: '5'
      Policies:
        - Statement:
            - Effect: Allow
              Action: sns:Publish
              Resource: '*'

  VerifyAuthChallengeFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: cognito_triggers.verify_auth_challenge

  AllowCognitoDefineChallenge:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref DefineAuthChallengeFunction
      Principal: cognito-idp.amazonaws.com
      SourceArn: !GetAtt GuardianUserPool.Arn
  AllowCognitoCreateChallenge:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref CreateAuthChallengeFunction
      Principal: cognito-idp.amazonaws.com
      SourceArn: !GetAtt GuardianUserPool.Arn
  AllowCognitoVerifyChallenge:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref VerifyAuthChallengeFunction
      Principal: cognito-idp.amazonaws.com
      SourceArn: !GetAtt GuardianUserPool.Arn

  CognitoSmsRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub guardian-${EnvironmentName}-cognito-sms-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: cognito-idp.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: CognitoSmsPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: sns:Publish
                Resource: '*'

  GuardianUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub guardian-${EnvironmentName}-users
      UsernameAttributes: [phone_number]
      AutoVerifiedAttributes: [phone_number]
      SmsConfiguration:
        SnsCallerArn: !GetAtt CognitoSmsRole.Arn
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_phone_number
            Priority: 1
      LambdaConfig:
        DefineAuthChallenge: !GetAtt DefineAuthChallengeFunction.Arn
        CreateAuthChallenge: !GetAtt CreateAuthChallengeFunction.Arn
        VerifyAuthChallengeResponse: !GetAtt VerifyAuthChallengeFunction.Arn
      Policies:
        PasswordPolicy:
          MinimumLength: 16
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: true
          RequireUppercase: true
          TemporaryPasswordValidityDays: 1
      UserPoolAddOns:
        AdvancedSecurityMode: ENFORCED

  GuardianUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub guardian-${EnvironmentName}-mobile
      UserPoolId: !Ref GuardianUserPool
      GenerateSecret: false
      EnableTokenRevocation: true
      PreventUserExistenceErrors: ENABLED

      ExplicitAuthFlows: [ALLOW_CUSTOM_AUTH, ALLOW_REFRESH_TOKEN_AUTH, ALLOW_ADMIN_USER_PASSWORD_AUTH]
      AccessTokenValidity: 15
      IdTokenValidity: 15
      RefreshTokenValidity: 30
      TokenValidityUnits:
        AccessToken: minutes
        IdToken: minutes
        RefreshToken: days

  GuardianResponderGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: responder
      Description: Manually approved Guardian responder cohort
      UserPoolId: !Ref GuardianUserPool

  IncidentsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub guardian-${EnvironmentName}-incidents
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification: {PointInTimeRecoveryEnabled: true}
      SSESpecification: {SSEEnabled: true}
      AttributeDefinitions: [{AttributeName: incident_id, AttributeType: S}]
      KeySchema: [{AttributeName: incident_id, KeyType: HASH}]
  IncidentEventsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub guardian-${EnvironmentName}-incident-events
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification: {PointInTimeRecoveryEnabled: true}
      SSESpecification: {SSEEnabled: true}
      AttributeDefinitions:
        - {AttributeName: incident_id, AttributeType: S}
        - {AttributeName: timestamp, AttributeType: S}
      KeySchema:
        - {AttributeName: incident_id, KeyType: HASH}
        - {AttributeName: timestamp, KeyType: RANGE}
  RespondersTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub guardian-${EnvironmentName}-responders
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification: {PointInTimeRecoveryEnabled: true}
      SSESpecification: {SSEEnabled: true}
      AttributeDefinitions:
        - {AttributeName: responder_id, AttributeType: S}
        - {AttributeName: geohash, AttributeType: S}
        - {AttributeName: availability_expires_at, AttributeType: N}
      KeySchema: [{AttributeName: responder_id, KeyType: HASH}]
      GlobalSecondaryIndexes:
        - IndexName: GeohashIndex
          KeySchema:
            - {AttributeName: geohash, KeyType: HASH}
            - {AttributeName: availability_expires_at, KeyType: RANGE}
          Projection: {ProjectionType: ALL}
  MissionsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub guardian-${EnvironmentName}-missions
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification: {PointInTimeRecoveryEnabled: true}
      SSESpecification: {SSEEnabled: true}
      TimeToLiveSpecification:
        AttributeName: expires_at
        Enabled: true
      AttributeDefinitions:
        - {AttributeName: mission_id, AttributeType: S}
        - {AttributeName: responder_id, AttributeType: S}
        - {AttributeName: incident_id, AttributeType: S}
        - {AttributeName: invited_at, AttributeType: S}
      KeySchema: [{AttributeName: mission_id, KeyType: HASH}]
      GlobalSecondaryIndexes:
        - IndexName: ResponderMissionsIndex
          KeySchema:
            - {AttributeName: responder_id, KeyType: HASH}
            - {AttributeName: invited_at, KeyType: RANGE}
          Projection: {ProjectionType: ALL}
        - IndexName: IncidentMissionsIndex
          KeySchema:
            - {AttributeName: incident_id, KeyType: HASH}
            - {AttributeName: invited_at, KeyType: RANGE}
          Projection: {ProjectionType: ALL}
  UsersTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub guardian-${EnvironmentName}-users
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification: {PointInTimeRecoveryEnabled: true}
      SSESpecification: {SSEEnabled: true}
      AttributeDefinitions: [{AttributeName: user_id, AttributeType: S}]
      KeySchema: [{AttributeName: user_id, KeyType: HASH}]
  AuthThrottleTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub guardian-${EnvironmentName}-auth-throttle
      BillingMode: PAY_PER_REQUEST
      SSESpecification: {SSEEnabled: true}
      TimeToLiveSpecification:
        AttributeName: expires_at
        Enabled: true
      AttributeDefinitions: [{AttributeName: throttle_key, AttributeType: S}]
      KeySchema: [{AttributeName: throttle_key, KeyType: HASH}]
  SessionsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub guardian-${EnvironmentName}-sessions
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification: {PointInTimeRecoveryEnabled: true}
      SSESpecification: {SSEEnabled: true}
      TimeToLiveSpecification: {AttributeName: expires_at, Enabled: true}
      AttributeDefinitions:
        - {AttributeName: session_id, AttributeType: S}
        - {AttributeName: user_id, AttributeType: S}
        - {AttributeName: created_at, AttributeType: S}
      KeySchema: [{AttributeName: session_id, KeyType: HASH}]
      GlobalSecondaryIndexes:
        - IndexName: UserSessionsIndex
          KeySchema:
            - {AttributeName: user_id, KeyType: HASH}
            - {AttributeName: created_at, KeyType: RANGE}
          Projection: {ProjectionType: ALL}
  AgentLedgerTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub guardian-${EnvironmentName}-agent-ledger
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification: {PointInTimeRecoveryEnabled: true}
      SSESpecification: {SSEEnabled: true}
      AttributeDefinitions:
        - {AttributeName: incident_id, AttributeType: S}
        - {AttributeName: event_id, AttributeType: S}
      KeySchema:
        - {AttributeName: incident_id, KeyType: HASH}
        - {AttributeName: event_id, KeyType: RANGE}
  AgentAuthorizationsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub guardian-${EnvironmentName}-agent-authorizations
      BillingMode: PAY_PER_REQUEST
      SSESpecification: {SSEEnabled: true}
      TimeToLiveSpecification: {AttributeName: expires_at, Enabled: true}
      AttributeDefinitions: [{AttributeName: authorization_id, AttributeType: S}]
      KeySchema: [{AttributeName: authorization_id, KeyType: HASH}]
  AgentPolicySigningSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Description: HMAC key for short-lived Guardian agent policy capabilities
      GenerateSecretString:
        PasswordLength: 64
        ExcludePunctuation: true

  GuardianApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: lambda_handler.handler
      Environment:
        Variables: &ApiEnvironment
          COGNITO_USER_POOL_ID: !Ref GuardianUserPool
          COGNITO_CLIENT_ID: !Ref GuardianUserPoolClient
          DYNAMODB_INCIDENTS_TABLE: !Ref IncidentsTable
          DYNAMODB_EVENTS_TABLE: !Ref IncidentEventsTable
          DYNAMODB_RESPONDERS_TABLE: !Ref RespondersTable
          DYNAMODB_MISSIONS_TABLE: !Ref MissionsTable
          DYNAMODB_USERS_TABLE: !Ref UsersTable
          DYNAMODB_AUTH_THROTTLE_TABLE: !Ref AuthThrottleTable
          DYNAMODB_SESSIONS_TABLE: !Ref SessionsTable
          DYNAMODB_AGENT_LEDGER_TABLE: !Ref AgentLedgerTable
          DYNAMODB_AGENT_AUTHORIZATIONS_TABLE: !Ref AgentAuthorizationsTable
          AGENT_POLICY_SECRET_ARN: !Ref AgentPolicySigningSecret
          EVENTBUS_NAME: default
          SNS_FCM_PLATFORM_ARN: !Ref FcmPlatformApplicationArn
          SNS_APNS_PLATFORM_ARN: !Ref ApnsPlatformApplicationArn
          BEDROCK_MODEL_ID: anthropic.claude-3-haiku-20240307-v1:0
      Policies:
        - DynamoDBCrudPolicy: {TableName: !Ref IncidentsTable}
        - DynamoDBCrudPolicy: {TableName: !Ref IncidentEventsTable}
        - DynamoDBCrudPolicy: {TableName: !Ref RespondersTable}
        - DynamoDBCrudPolicy: {TableName: !Ref MissionsTable}
        - DynamoDBCrudPolicy: {TableName: !Ref UsersTable}
        - DynamoDBCrudPolicy: {TableName: !Ref AuthThrottleTable}
        - DynamoDBCrudPolicy: {TableName: !Ref SessionsTable}
        - Statement:
            - Effect: Allow
              Action: dynamodb:PutItem
              Resource: !GetAtt AgentLedgerTable.Arn
        - DynamoDBCrudPolicy: {TableName: !Ref AgentAuthorizationsTable}
        - EventBridgePutEventsPolicy: {EventBusName: default}
        - Statement:
            - Effect: Allow
              Action:
                - cognito-idp:AdminCreateUser
                - cognito-idp:AdminSetUserPassword
                - cognito-idp:AdminInitiateAuth
                - cognito-idp:GetUser
                - cognito-idp:GlobalSignOut
                - cognito-idp:AdminListGroupsForUser
              Resource: !GetAtt GuardianUserPool.Arn
            - Effect: Allow
              Action:
                - cognito-idp:InitiateAuth
                - cognito-idp:RespondToAuthChallenge
              Resource: '*'
            - Effect: Allow
              Action: [sns:CreatePlatformEndpoint, sns:GetEndpointAttributes, sns:SetEndpointAttributes, sns:Publish]
              Resource: '*'
            - Effect: Allow
              Action: bedrock:InvokeModel
              Resource: '*'
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: !Ref AgentPolicySigningSecret
      Events:
        PublicRoot:
          Type: Api
          Properties: {Path: /, Method: get, Auth: {Authorizer: NONE}}
        SendOtp:
          Type: Api
          Properties: {Path: /auth/send-otp, Method: post, Auth: {Authorizer: NONE}}
        VerifyOtp:
          Type: Api
          Properties: {Path: /auth/verify-otp, Method: post, Auth: {Authorizer: NONE}}
        RefreshToken:
          Type: Api
          Properties: {Path: /auth/refresh, Method: post, Auth: {Authorizer: NONE}}
        GoogleAuth:
          Type: Api
          Properties: {Path: /auth/google, Method: post, Auth: {Authorizer: NONE}}
        ProtectedApi:
          Type: Api
          Properties: {Path: '/{proxy+}', Method: any, Auth: {Authorizer: NONE}}

  AgentSchedulerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub guardian-${EnvironmentName}-agent-scheduler-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: scheduler.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: InvokeGuardianAgent
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !Sub arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:guardian-${EnvironmentName}-agent

  GuardianAgentFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub guardian-${EnvironmentName}-agent
      CodeUri: .
      Handler: agent.guardian_agent.lambda_handler
      Environment:
        Variables:
          <<: *ApiEnvironment
          SCHEDULER_ROLE_ARN: !GetAtt AgentSchedulerRole.Arn
      Policies:
        - DynamoDBCrudPolicy: {TableName: !Ref IncidentsTable}
        - DynamoDBCrudPolicy: {TableName: !Ref IncidentEventsTable}
        - DynamoDBReadPolicy: {TableName: !Ref RespondersTable}
        - DynamoDBCrudPolicy: {TableName: !Ref MissionsTable}
        - Statement:
            - Effect: Allow
              Action: dynamodb:PutItem
              Resource: !GetAtt AgentLedgerTable.Arn
        - DynamoDBCrudPolicy: {TableName: !Ref AgentAuthorizationsTable}
        - DynamoDBReadPolicy: {TableName: !Ref UsersTable}
        - Statement:
            - Effect: Allow
              Action: sns:Publish
              Resource: '*'
            - Effect: Allow
              Action: bedrock:InvokeModel
              Resource: '*'
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: !Ref AgentPolicySigningSecret
            - Effect: Allow
              Action: scheduler:CreateSchedule
              Resource: '*'
            - Effect: Allow
              Action: iam:PassRole
              Resource: !GetAtt AgentSchedulerRole.Arn
      Events:
        IncidentCreatedEvent:
          Type: EventBridgeRule
          Properties:
            Pattern:
              source: [guardian.incident]
              detail-type: [incident.created]

Outputs:
  ApiEndpoint:
    Value: !Sub 'https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod'
  CognitoUserPoolId:
    Value: !Ref GuardianUserPool
  CognitoClientId:
    Value: !Ref GuardianUserPoolClient
