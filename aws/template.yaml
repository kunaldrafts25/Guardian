AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Guardian production API, authentication, and emergency data plane

Globals:
  Function:
    Runtime: python3.12
    Timeout: 30
    MemorySize: 512
  Api:
    Auth:
      DefaultAuthorizer: CognitoAuthorizer
      AddDefaultAuthorizerToCorsPreflight: false
      Authorizers:
        CognitoAuthorizer:
          UserPoolArn: !GetAtt GuardianUserPool.Arn
          Identity:
            Header: Authorization

Resources:
  DefineAuthChallengeFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../
      Handler: aws.cognito_triggers.define_auth_challenge

  CreateAuthChallengeFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../
      Handler: aws.cognito_triggers.create_auth_challenge
      Environment:
        Variables:
          OTP_TTL_SECONDS: '300'
          OTP_MAX_ATTEMPTS: '5'
      Policies:
        - Statement:
            - Effect: Allow
              Action: sns:Publish
              Resource: '*'

  VerifyAuthChallengeFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../
      Handler: aws.cognito_triggers.verify_auth_challenge

  AllowCognitoDefineChallenge:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref DefineAuthChallengeFunction
      Principal: cognito-idp.amazonaws.com
      SourceArn: !GetAtt GuardianUserPool.Arn
  AllowCognitoCreateChallenge:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref CreateAuthChallengeFunction
      Principal: cognito-idp.amazonaws.com
      SourceArn: !GetAtt GuardianUserPool.Arn
  AllowCognitoVerifyChallenge:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref VerifyAuthChallengeFunction
      Principal: cognito-idp.amazonaws.com
      SourceArn: !GetAtt GuardianUserPool.Arn

  GuardianUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: guardian-users
      UsernameAttributes: [phone_number]
      AutoVerifiedAttributes: [phone_number]
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_phone_number
            Priority: 1
      LambdaConfig:
        DefineAuthChallenge: !GetAtt DefineAuthChallengeFunction.Arn
        CreateAuthChallenge: !GetAtt CreateAuthChallengeFunction.Arn
        VerifyAuthChallengeResponse: !GetAtt VerifyAuthChallengeFunction.Arn
      Policies:
        PasswordPolicy:
          MinimumLength: 16
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: true
          RequireUppercase: true
          TemporaryPasswordValidityDays: 1
      UserPoolAddOns:
        AdvancedSecurityMode: ENFORCED

  GuardianUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: guardian-mobile
      UserPoolId: !Ref GuardianUserPool
      GenerateSecret: false
      EnableTokenRevocation: true
      PreventUserExistenceErrors: ENABLED
      ExplicitAuthFlows: [ALLOW_CUSTOM_AUTH, ALLOW_REFRESH_TOKEN_AUTH]
      AccessTokenValidity: 15
      IdTokenValidity: 15
      RefreshTokenValidity: 30
      TokenValidityUnits:
        AccessToken: minutes
        IdToken: minutes
        RefreshToken: days

  IncidentsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: guardian-incidents
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification: {PointInTimeRecoveryEnabled: true}
      SSESpecification: {SSEEnabled: true}
      AttributeDefinitions: [{AttributeName: incident_id, AttributeType: S}]
      KeySchema: [{AttributeName: incident_id, KeyType: HASH}]
  IncidentEventsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: guardian-incident-events
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification: {PointInTimeRecoveryEnabled: true}
      SSESpecification: {SSEEnabled: true}
      AttributeDefinitions:
        - {AttributeName: incident_id, AttributeType: S}
        - {AttributeName: timestamp, AttributeType: S}
      KeySchema:
        - {AttributeName: incident_id, KeyType: HASH}
        - {AttributeName: timestamp, KeyType: RANGE}
  RespondersTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: guardian-responders
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification: {PointInTimeRecoveryEnabled: true}
      SSESpecification: {SSEEnabled: true}
      AttributeDefinitions: [{AttributeName: responder_id, AttributeType: S}]
      KeySchema: [{AttributeName: responder_id, KeyType: HASH}]
  MissionsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: guardian-missions
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification: {PointInTimeRecoveryEnabled: true}
      SSESpecification: {SSEEnabled: true}
      TimeToLiveSpecification:
        AttributeName: expires_at
        Enabled: true
      AttributeDefinitions: [{AttributeName: mission_id, AttributeType: S}]
      KeySchema: [{AttributeName: mission_id, KeyType: HASH}]
  UsersTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: guardian-users
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification: {PointInTimeRecoveryEnabled: true}
      SSESpecification: {SSEEnabled: true}
      AttributeDefinitions: [{AttributeName: user_id, AttributeType: S}]
      KeySchema: [{AttributeName: user_id, KeyType: HASH}]
  AuthThrottleTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: guardian-auth-throttle
      BillingMode: PAY_PER_REQUEST
      SSESpecification: {SSEEnabled: true}
      TimeToLiveSpecification:
        AttributeName: expires_at
        Enabled: true
      AttributeDefinitions: [{AttributeName: throttle_key, AttributeType: S}]
      KeySchema: [{AttributeName: throttle_key, KeyType: HASH}]
  SessionsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: guardian-sessions
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification: {PointInTimeRecoveryEnabled: true}
      SSESpecification: {SSEEnabled: true}
      TimeToLiveSpecification: {AttributeName: expires_at, Enabled: true}
      AttributeDefinitions:
        - {AttributeName: session_id, AttributeType: S}
        - {AttributeName: user_id, AttributeType: S}
        - {AttributeName: created_at, AttributeType: S}
      KeySchema: [{AttributeName: session_id, KeyType: HASH}]
      GlobalSecondaryIndexes:
        - IndexName: UserSessionsIndex
          KeySchema:
            - {AttributeName: user_id, KeyType: HASH}
            - {AttributeName: created_at, KeyType: RANGE}
          Projection: {ProjectionType: ALL}
  AgentLedgerTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: guardian-agent-ledger
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification: {PointInTimeRecoveryEnabled: true}
      SSESpecification: {SSEEnabled: true}
      AttributeDefinitions:
        - {AttributeName: incident_id, AttributeType: S}
        - {AttributeName: event_id, AttributeType: S}
      KeySchema:
        - {AttributeName: incident_id, KeyType: HASH}
        - {AttributeName: event_id, KeyType: RANGE}
  AgentAuthorizationsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: guardian-agent-authorizations
      BillingMode: PAY_PER_REQUEST
      SSESpecification: {SSEEnabled: true}
      TimeToLiveSpecification: {AttributeName: expires_at, Enabled: true}
      AttributeDefinitions: [{AttributeName: authorization_id, AttributeType: S}]
      KeySchema: [{AttributeName: authorization_id, KeyType: HASH}]
  AgentPolicySigningSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Description: HMAC key for short-lived Guardian agent policy capabilities
      GenerateSecretString:
        PasswordLength: 64
        ExcludePunctuation: true

  EmergencyAlertsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: guardian-trusted-contact-alerts
      DisplayName: Guardian Alerts

  GuardianApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../
      Handler: aws.lambda_handler.handler
      Environment:
        Variables: &ApiEnvironment
          COGNITO_USER_POOL_ID: !Ref GuardianUserPool
          COGNITO_CLIENT_ID: !Ref GuardianUserPoolClient
          DYNAMODB_INCIDENTS_TABLE: !Ref IncidentsTable
          DYNAMODB_EVENTS_TABLE: !Ref IncidentEventsTable
          DYNAMODB_RESPONDERS_TABLE: !Ref RespondersTable
          DYNAMODB_MISSIONS_TABLE: !Ref MissionsTable
          DYNAMODB_USERS_TABLE: !Ref UsersTable
          DYNAMODB_AUTH_THROTTLE_TABLE: !Ref AuthThrottleTable
          DYNAMODB_SESSIONS_TABLE: !Ref SessionsTable
          DYNAMODB_AGENT_LEDGER_TABLE: !Ref AgentLedgerTable
          DYNAMODB_AGENT_AUTHORIZATIONS_TABLE: !Ref AgentAuthorizationsTable
          AGENT_POLICY_SECRET_ARN: !Ref AgentPolicySigningSecret
          EVENTBUS_NAME: default
          SNS_TOPIC_ARN: !Ref EmergencyAlertsTopic
          BEDROCK_MODEL_ID: anthropic.claude-3-haiku-20240307-v1:0
      Policies:
        - DynamoDBCrudPolicy: {TableName: !Ref IncidentsTable}
        - DynamoDBCrudPolicy: {TableName: !Ref IncidentEventsTable}
        - DynamoDBCrudPolicy: {TableName: !Ref RespondersTable}
        - DynamoDBCrudPolicy: {TableName: !Ref MissionsTable}
        - DynamoDBCrudPolicy: {TableName: !Ref UsersTable}
        - DynamoDBCrudPolicy: {TableName: !Ref AuthThrottleTable}
        - DynamoDBCrudPolicy: {TableName: !Ref SessionsTable}
        - DynamoDBCrudPolicy: {TableName: !Ref AgentLedgerTable}
        - DynamoDBCrudPolicy: {TableName: !Ref AgentAuthorizationsTable}
        - SNSPublishMessagePolicy: {TopicName: !GetAtt EmergencyAlertsTopic.TopicName}
        - EventBridgePutEventsPolicy: {EventBusName: default}
        - Statement:
            - Effect: Allow
              Action:
                - cognito-idp:AdminCreateUser
                - cognito-idp:AdminSetUserPassword
                - cognito-idp:GetUser
                - cognito-idp:GlobalSignOut
                - cognito-idp:AdminListGroupsForUser
              Resource: !GetAtt GuardianUserPool.Arn
            - Effect: Allow
              Action:
                - cognito-idp:InitiateAuth
                - cognito-idp:RespondToAuthChallenge
              Resource: '*'
            - Effect: Allow
              Action: [sns:CreatePlatformEndpoint, sns:GetEndpointAttributes, sns:SetEndpointAttributes, sns:Publish]
              Resource: '*'
            - Effect: Allow
              Action: bedrock:InvokeModel
              Resource: '*'
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: !Ref AgentPolicySigningSecret
      Events:
        PublicRoot:
          Type: Api
          Properties: {Path: /, Method: get, Auth: {Authorizer: NONE}}
        SendOtp:
          Type: Api
          Properties: {Path: /auth/send-otp, Method: post, Auth: {Authorizer: NONE}}
        VerifyOtp:
          Type: Api
          Properties: {Path: /auth/verify-otp, Method: post, Auth: {Authorizer: NONE}}
        RefreshToken:
          Type: Api
          Properties: {Path: /auth/refresh, Method: post, Auth: {Authorizer: NONE}}
        ProtectedApi:
          Type: Api
          Properties: {Path: '/{proxy+}', Method: any}

  GuardianAgentFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../
      Handler: aws.agent.guardian_agent.lambda_handler
      Environment:
        Variables: *ApiEnvironment
      Policies:
        - DynamoDBCrudPolicy: {TableName: !Ref IncidentsTable}
        - DynamoDBCrudPolicy: {TableName: !Ref IncidentEventsTable}
        - DynamoDBReadPolicy: {TableName: !Ref RespondersTable}
        - DynamoDBCrudPolicy: {TableName: !Ref MissionsTable}
        - DynamoDBCrudPolicy: {TableName: !Ref AgentLedgerTable}
        - DynamoDBCrudPolicy: {TableName: !Ref AgentAuthorizationsTable}
        - DynamoDBReadPolicy: {TableName: !Ref UsersTable}
        - SNSPublishMessagePolicy: {TopicName: !GetAtt EmergencyAlertsTopic.TopicName}
        - Statement:
            - Effect: Allow
              Action: bedrock:InvokeModel
              Resource: '*'
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: !Ref AgentPolicySigningSecret
      Events:
        IncidentCreatedEvent:
          Type: EventBridgeRule
          Properties:
            Pattern:
              source: [guardian.incident]
              detail-type: [incident.created]

Outputs:
  ApiEndpoint:
    Value: !Sub 'https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod'
  CognitoUserPoolId:
    Value: !Ref GuardianUserPool
  CognitoClientId:
    Value: !Ref GuardianUserPoolClient
