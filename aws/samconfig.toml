version = 0.1

[default]
[default.global.parameters]
stack_name = "guardian-staging"

[default.build.parameters]
cached = true
parallel = true

[default.validate.parameters]
lint = true

[default.deploy.parameters]
capabilities = "CAPABILITY_IAM CAPABILITY_NAMED_IAM"
resolve_s3 = true
stack_name = "guardian-staging"
region = "ap-south-1"
profile = "kunal"
parameter_overrides = [
    "EnvironmentName=\"staging\"",
    "FcmPlatformApplicationArn=\"arn:aws:sns:ap-south-1:728721961184:app/GCM/guardian-staging-android\"",
    "ApnsPlatformApplicationArn=\"\""
]
image_repositories = []
