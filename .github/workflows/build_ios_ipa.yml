name: Build iOS IPA (Free Sideloading)

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'lib/**'
      - 'ios/**'
      - 'pubspec.yaml'
      - '.github/workflows/build_ios_ipa.yml'

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ipa:
    name: Build Guardian IPA for iOS
    runs-on: macos-14
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Create stub Config.xcconfig if missing
        run: |
          mkdir -p ios/Runner
          touch ios/Runner/Config.xcconfig

      - name: Setup GoogleService-Info.plist
        run: |
          cat << 'EOF' > ios/Runner/GoogleService-Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
          	<key>CLIENT_ID</key>
          	<string>530178096868-90d5lls6prav97gaueu9814dgprlmlm7.apps.googleusercontent.com</string>
          	<key>REVERSED_CLIENT_ID</key>
          	<string>com.googleusercontent.apps.530178096868-90d5lls6prav97gaueu9814dgprlmlm7</string>
          	<key>API_KEY</key>
          	<string>AIzaSyCI-dAeXi1kgCYAzUbSoY8cnt5J9W56zi4</string>
          	<key>GCM_SENDER_ID</key>
          	<string>530178096868</string>
          	<key>PLIST_VERSION</key>
          	<string>1</string>
          	<key>BUNDLE_ID</key>
          	<string>com.company.guardian</string>
          	<key>PROJECT_ID</key>
          	<string>guardian-70059</string>
          	<key>STORAGE_BUCKET</key>
          	<string>guardian-70059.firebasestorage.app</string>
          	<key>IS_ADS_ENABLED</key>
          	<false></false>
          	<key>IS_ANALYTICS_ENABLED</key>
          	<false></false>
          	<key>IS_APPINVITE_ENABLED</key>
          	<true></true>
          	<key>IS_GCM_ENABLED</key>
          	<true></true>
          	<key>IS_SIGNIN_ENABLED</key>
          	<true></true>
          	<key>GOOGLE_APP_ID</key>
          	<string>1:530178096868:ios:828f1a83ad34be612f36f1</string>
          </dict>
          </plist>
          EOF

      - name: Install CocoaPods
        working-directory: ios
        run: pod install --repo-update

      - name: Build iOS Release (Device, No Codesign)
        run: flutter build ios --release --no-codesign

      - name: Package IPA Payload
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r Guardian.ipa Payload
          ls -lh Guardian.ipa

      - name: Upload Guardian IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Guardian-iOS-IPA
          path: Guardian.ipa
          retention-days: 14
