name: Phase 5 Dependency + Format Sync

on:
  push:
    branches: [ phase5-production-hardening ]

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase5-production-hardening
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Apply canonical Dart formatter
        run: dart format lib test

      - name: Commit deterministic outputs
        shell: bash
        run: |
          if git diff --quiet -- pubspec.lock lib test; then
            echo "No dependency/format changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pubspec.lock lib test
          git commit -m "chore(ci): sync Phase 5 dependencies and formatting"
          git push origin HEAD:phase5-production-hardening
