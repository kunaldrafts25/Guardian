name: Phase 4 Autoformat

on:
  push:
    branches: [ phase4-critical-repair ]

permissions:
  contents: write

jobs:
  dart-format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase4-critical-repair
          fetch-depth: 0
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Apply canonical Dart formatter
        run: dart format lib test
      - name: Commit formatter output
        shell: bash
        run: |
          if git diff --quiet -- lib test; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib test
          git commit -m "chore(ci): apply canonical Dart formatting"
          git push origin HEAD:phase4-critical-repair
