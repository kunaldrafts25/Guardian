      - name: Generate code artifacts required for build
        run: |
          dart run build_runner build --delete-conflicting-outputs
          if [ ! -f lib/firebase_options.dart ]; then
            cat > lib/firebase_options.dart <<'EOF'
            import 'package:firebase_core/firebase_core.dart' show FirebaseOptions;
            import 'package:flutter/foundation.dart' show TargetPlatform, defaultTargetPlatform, kIsWeb;

            class DefaultFirebaseOptions {
              static const String _apiKey = String.fromEnvironment(
                'FIREBASE_API_KEY',
                defaultValue: 'ci-placeholder',
              );

              static FirebaseOptions get currentPlatform {
                if (kIsWeb) return web;
                switch (defaultTargetPlatform) {
                  case TargetPlatform.android:
                    return android;
                  case TargetPlatform.iOS:
                    return ios;
                  case TargetPlatform.macOS:
                    return macos;
                  case TargetPlatform.windows:
                    return windows;
                  case TargetPlatform.linux:
                    return android;
                  default:
                    throw UnsupportedError('Unsupported platform');
                }
              }

              static const FirebaseOptions web = FirebaseOptions(
                apiKey: _apiKey,
                appId: '1:1007199571452:web:621a586209d4d37fef7679',
                messagingSenderId: '1007199571452',
                projectId: 'guardian-64640',
              );

              static const FirebaseOptions android = FirebaseOptions(
                apiKey: _apiKey,
                appId: '1:1007199571452:android:4c51825e5413c1a7ef7679',
                messagingSenderId: '1007199571452',
                projectId: 'guardian-64640',
              );

              static const FirebaseOptions ios = FirebaseOptions(
                apiKey: _apiKey,
                appId: '1:1007199571452:ios:05f64ef1c839f2f7ef7679',
                messagingSenderId: '1007199571452',
                projectId: 'guardian-64640',
              );

              static const FirebaseOptions macos = FirebaseOptions(
                apiKey: _apiKey,
                appId: '1:1007199571452:ios:05f64ef1c839f2f7ef7679',
                messagingSenderId: '1007199571452',
                projectId: 'guardian-64640',
              );

              static const FirebaseOptions windows = FirebaseOptions(
                apiKey: _apiKey,
                appId: '1:1007199571452:web:91131ba170a35f53ef7679',
                messagingSenderId: '1007199571452',
                projectId: 'guardian-64640',
              );
            }
            EOF
          fi

      - name: Build iOS
        run: flutter build ios --release --no-codesign

      - name: Upload iOS build
        uses: actions/upload-artifact@v4
        with:
          name: ios-build
          path: build/ios/iphoneos
