name: Flutter CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: flutter-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.4'

jobs:
  flutter-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify generated database code
        run: |
          dart run build_runner build
          git diff --exit-code -- lib/core/database/guardian_database.g.dart

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze project source
        run: flutter analyze --no-fatal-infos

      - name: Run tests with coverage
        run: flutter test --coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage/lcov.info
          fail_ci_if_error: false

      - name: Generate HTML coverage report
        run: |
          sudo apt-get update
          sudo apt-get install -y lcov
          genhtml coverage/lcov.info -o coverage/html

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/html

  backend-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: aws/requirements-test.txt

      - name: Install backend test dependencies
        run: python -m pip install --requirement aws/requirements-test.txt

      - name: Run backend tests
        env:
          GUARDIAN_DEV_MODE: 'true'
        run: python -m pytest aws/tests --quiet

      - name: Setup AWS SAM CLI
        uses: aws-actions/setup-sam@v2

      - name: Validate and package Lambda functions
        working-directory: aws
        run: |
          sam validate --lint --template-file template.yaml
          sam build --template-file template.yaml

  build-android:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: [flutter-test, backend-test]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Create ephemeral CI signing key
        run: |
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/guardian-ci.jks" \
            -storepass guardian-ci-only \
            -keypass guardian-ci-only \
            -alias guardian-ci \
            -keyalg RSA \
            -keysize 2048 \
            -validity 2 \
            -dname "CN=Guardian CI,OU=Build Verification,O=Guardian,C=IN"
          echo "GUARDIAN_KEYSTORE_PATH=$RUNNER_TEMP/guardian-ci.jks" >> "$GITHUB_ENV"
          echo "GUARDIAN_KEYSTORE_PASSWORD=guardian-ci-only" >> "$GITHUB_ENV"
          echo "GUARDIAN_KEY_ALIAS=guardian-ci" >> "$GITHUB_ENV"
          echo "GUARDIAN_KEY_PASSWORD=guardian-ci-only" >> "$GITHUB_ENV"

      - name: Build signed release APK
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ci-signed-release-apk-not-for-distribution
          path: build/app/outputs/flutter-apk/app-release.apk

  build-ios:
    runs-on: macos-15
    timeout-minutes: 30
    needs: [flutter-test, backend-test]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Configure unsigned Xcode build settings
        run: |
          mkdir -p ios/Runner
          cat << 'EOF' > ios/Runner/Config.xcconfig
          CODE_SIGNING_ALLOWED=NO
          CODE_SIGNING_REQUIRED=NO
          CODE_SIGN_IDENTITY=
          EXPANDED_CODE_SIGN_IDENTITY=
          EOF

      - name: Setup GoogleService-Info.plist
        run: |
          cat << 'EOF' > ios/Runner/GoogleService-Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
          	<key>CLIENT_ID</key>
          	<string>guardian-ci-client.apps.googleusercontent.com</string>
          	<key>REVERSED_CLIENT_ID</key>
          	<string>com.googleusercontent.apps.guardian-ci-client</string>
          	<key>API_KEY</key>
          	<string>guardian-ci-placeholder-api-key</string>
          	<key>GCM_SENDER_ID</key>
          	<string>000000000000</string>
          	<key>PLIST_VERSION</key>
          	<string>1</string>
          	<key>BUNDLE_ID</key>
          	<string>com.company.guardian</string>
          	<key>PROJECT_ID</key>
          	<string>guardian-ci</string>
          	<key>STORAGE_BUCKET</key>
          	<string>guardian-ci.invalid</string>
          	<key>IS_ADS_ENABLED</key>
          	<false></false>
          	<key>IS_ANALYTICS_ENABLED</key>
          	<false></false>
          	<key>IS_APPINVITE_ENABLED</key>
          	<true></true>
          	<key>IS_GCM_ENABLED</key>
          	<true></true>
          	<key>IS_SIGNIN_ENABLED</key>
          	<true></true>
          	<key>GOOGLE_APP_ID</key>
          	<string>1:000000000000:ios:828f1a83ad34be612f36f1</string>
          </dict>
          </plist>
          EOF

      - name: Install CocoaPods dependencies
        working-directory: ios
        run: pod install

      - name: Build iOS (Simulator)
        run: flutter build ios --simulator --no-codesign

      - name: Upload iOS build
        uses: actions/upload-artifact@v4
        with:
          name: ios-build
          path: build/ios/iphonesimulator
